name: Mertviy release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate tag, bundled assets, and notices
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must have the form vX.Y.Z; got $tag"
          }
          $version = $Matches.version
          "MERTVIY_VERSION=$version" >> $env:GITHUB_ENV

          $required = @(
            'EngineAssets/ENGINE_VERSION.txt',
            'EngineAssets/LICENSE.txt',
            'EngineAssets/THIRD-PARTY-NOTICES.txt',
            'third_party/sources/Flowseal-1.9.9d-SHA256SUMS.txt',
            'third_party/sources/WinDivert-2.2.2/LICENSE',
            'third_party/sources/Cygwin-3.4.10/COPYING.LIB',
            'third_party/sources/Cygwin-3.4.10/winsup/CYGWIN_LICENSE'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release provenance file is missing: $path"
            }
          }

          $manifest = Get-Content 'third_party/sources/Flowseal-1.9.9d-SHA256SUMS.txt'
          $checks = @{
            'winws.exe' = 'EngineAssets/winws.exe'
            'WinDivert.dll' = 'EngineAssets/WinDivert.dll'
            'WinDivert64.sys' = 'EngineAssets/WinDivert64.sys'
            'cygwin1.dll' = 'EngineAssets/cygwin1.dll'
          }
          foreach ($name in $checks.Keys) {
            $entry = $manifest | Where-Object { $_ -match "^([0-9a-fA-F]{64})\s+\./bin/$([regex]::Escape($name))$" } | Select-Object -First 1
            if (-not $entry) { throw "No upstream hash for $name" }
            $expected = [regex]::Match($entry, '^[0-9a-fA-F]{64}').Value.ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $checks[$name] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Bundled file hash differs from Flowseal 1.9.9d: $name" }
          }

      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: >-
          dotnet publish .\Mertviy.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:VersionPrefix=$env:MERTVIY_VERSION
          -p:InformationalVersion=$env:MERTVIY_VERSION -o .\publish

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --tool-path .\tools\wix wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX Toolset 5.0.2.' }
          .\tools\wix\wix.exe build .\packaging\Mertviy.wxs -arch x64 `
            -d Version=$env:MERTVIY_VERSION -d PublishDir=publish `
            -o "publish\Mertviy-$env:MERTVIY_VERSION-win-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the MSI installer.' }

      - name: Create checksums and versioned assets
        shell: pwsh
        run: |
          $assets = @(
            @{ Source = 'publish/Mertviy.exe'; Name = "Mertviy-$env:MERTVIY_VERSION-win-x64.exe" },
            @{ Source = "publish/Mertviy-$env:MERTVIY_VERSION-win-x64.msi"; Name = "Mertviy-$env:MERTVIY_VERSION-win-x64.msi" }
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset.Source -PathType Leaf)) {
              throw "Publish output is missing $($asset.Source)"
            }
            $versionedPath = "publish/$($asset.Name)"
            if ($asset.Source -ne $versionedPath) {
              Copy-Item -LiteralPath $asset.Source -Destination $versionedPath -Force
            }
            $hash = (Get-FileHash -LiteralPath $versionedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)" | Set-Content -NoNewline -Encoding ascii "$versionedPath.sha256"
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "publish/Mertviy-$env:MERTVIY_VERSION-win-x64.exe"
          $msi = "publish/Mertviy-$env:MERTVIY_VERSION-win-x64.msi"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe "$exe.sha256" $msi "$msi.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $exe "$exe.sha256" $msi "$msi.sha256" `
              --repo $env:GITHUB_REPOSITORY `
              --title "Mertviy $env:MERTVIY_VERSION" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release assets.' }
